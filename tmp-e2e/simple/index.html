<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Artisan site</title>
<!-- composed by artisan | skills: anti-slop, forms-and-states, accessibility, frontend-master, project-architecture, design-tokens | build: styles/main.css + scripts/main.js -->
<meta name="description" content="A considered interface."/>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300..700&family=Space+Mono:wght@300..700&display=swap" />
<style>
/* =============================================================
   Soft Product — base layer
   Generated from design tokens. Change values in .forge/config.json
   or in the :root block below, never by editing rules ad hoc.
   ============================================================= */

:root {
  /* palette */
  --color-bg: #fafafa;
  --color-surface: #ffffff;
  --color-surface-alt: #f2f2f2;
  --color-text: #141415;
  --color-text-muted: #757575;
  --color-text-faint: #99999a;
  --color-accent: #3b6df6;
  --color-accent-hover: #1551f4;
  --color-accent-quiet: #c1cff6;
  --color-accent-soft: rgb(59 109 246 / 0.12);
  --color-accent-readable: #3b6df6;
  --color-on-accent: #ffffff;
  --color-border: rgb(0 0 0 / 0.1);
  --color-border-strong: rgb(0 0 0 / 0.2);

  /* type */
  --font-sans: "Plus Jakarta Sans", "Inter", system-ui, sans-serif;
  --font-display: "Plus Jakarta Sans", "Inter", system-ui, sans-serif;
  --font-mono: "Space Mono", ui-monospace, monospace;
  --text-xs: 0.64rem;
  --text-sm: 0.8rem;
  --text-base: 1rem;
  --text-lg: 1.25rem;
  --text-xl: 1.563rem;
  --text-2xl: clamp(1.641rem, 1.77rem + 0.39vw, 1.953rem);
  --text-3xl: clamp(2.05rem, 2.21rem + 0.49vw, 2.441rem);
  --text-4xl: clamp(2.564rem, 2.76rem + 0.61vw, 3.052rem);
  --text-5xl: clamp(3.205rem, 3.45rem + 0.76vw, 3.815rem);
  --weight-regular: 400;
  --weight-medium: 500;
  --weight-semibold: 600;
  --weight-bold: 700;
  --tracking-display: -0.02em;
  --tracking-heading: -0.01em;
  --tracking-body: 0;
  --tracking-caps: 0.08em;

  /* space + shape */
  --space-0: 0;
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-6: 24px;
  --space-8: 32px;
  --space-12: 48px;
  --space-16: 64px;
  --space-24: 96px;
  --space-32: 128px;
  --space-section: 96px;
  --space-sectionLg: 160px;
  --space-gutter: 20px;
  --radius-sm: 10px;
  --radius-md: 16px;
  --radius-lg: 24px;
  --radius-xl: 32px;
  --radius-pill: 999px;
  --shadow-xs: 0 1px 2px rgb(16 16 20 / 0.06);
  --shadow-sm: 0 2px 6px rgb(16 16 20 / 0.08);
  --shadow-md: 0 12px 28px rgb(16 16 20 / 0.10);
  --shadow-lg: 0 28px 60px rgb(16 16 20 / 0.14);
  --shadow-accentGlow: 0 14px 40px rgb(59 109 246 / 0.22);
  --shadow-inset: inset 0 1px 0 rgb(255 255 255 / 0.6);

  /* motion */
  --duration-instant: 90ms;
  --duration-fast: 160ms;
  --duration-base: 220ms;
  --duration-slow: 380ms;
  --duration-cinematic: 720ms;
  --ease-standard: cubic-bezier(0.2, 0.7, 0.2, 1);
  --ease-emphasized: cubic-bezier(0.16, 1, 0.3, 1);
  --ease-entrance: cubic-bezier(0.22, 1, 0.36, 1);
  --ease-exit: cubic-bezier(0.4, 0, 1, 1);
  --ease-spring: cubic-bezier(0.34, 1.4, 0.64, 1);
  --stagger: 55ms;
  --motion-distance: 12px;
  --motion-lift: 2px;

  /* layout */
  --max-width: 68rem;
  --prose-width: 62ch;
}

*,
*::before,
*::after { box-sizing: border-box; }

html {
  -webkit-text-size-adjust: 100%;
  scroll-behavior: smooth;
}

body {
  margin: 0;
  background: var(--color-bg);
  color: var(--color-text);
  font-family: var(--font-sans);
  font-size: var(--text-base);
  line-height: 1.6;
  letter-spacing: var(--tracking-body);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

h1, h2, h3, h4 {
  margin: 0;
  font-family: var(--font-display);
  font-weight: var(--weight-semibold);
  line-height: 1.08;
  letter-spacing: var(--tracking-display);
  text-wrap: balance;
}

p { margin: 0; text-wrap: pretty; }

a { color: inherit; text-underline-offset: 3px; }

img, svg, video { display: block; max-width: 100%; height: auto; }

button, input, select, textarea { font: inherit; color: inherit; }

:focus-visible {
  outline: 2px solid var(--color-accent);
  outline-offset: 3px;
  border-radius: var(--radius-sm);
}

::selection { background: var(--color-accent); color: var(--color-on-accent); }

/* ---------------------------------------------------------------- layout ---- */

.container {
  width: 100%;
  max-width: var(--max-width);
  margin-inline: auto;
  padding-inline: var(--space-6);
}

.section { padding-block: var(--space-section); position: relative; }
.section--tight { padding-block: var(--space-12); }

.section__head {
  display: flex;
  flex-direction: column;
  gap: var(--space-3);
  max-width: var(--prose-width);
  margin-bottom: var(--space-10);
}

.section__eyebrow {
  font-family: var(--font-mono);
  font-size: var(--text-xs);
  letter-spacing: var(--tracking-caps);
  text-transform: uppercase;
  color: var(--color-text-muted);
}

.section__title { font-size: var(--text-3xl); letter-spacing: var(--tracking-heading); }

.lede { font-size: var(--text-lg); color: var(--color-text-muted); max-width: var(--prose-width); }

.hairline { border: 0; border-top: 1px solid var(--color-border); margin: 0; }

.stack { display: flex; flex-direction: column; }
.stack--xs { gap: var(--space-2); }
.stack--sm { gap: var(--space-4); }
.stack--md { gap: var(--space-6); }
.stack--lg { gap: var(--space-10); }

.cluster { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-4); }

.grid { display: grid; gap: var(--space-6); }
.grid--2 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 20rem), 1fr)); }
.grid--3 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 16rem), 1fr)); }
.grid--4 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 12rem), 1fr)); }

.visually-hidden {
  position: absolute;
  width: 1px; height: 1px;
  padding: 0; margin: -1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
  border: 0;
}

.skip-link {
  position: absolute;
  top: var(--space-3);
  left: var(--space-3);
  padding: var(--space-2) var(--space-4);
  background: var(--color-accent);
  color: var(--color-on-accent);
  border-radius: var(--radius-sm);
  transform: translateY(-200%);
  transition: transform var(--duration-fast) var(--ease-standard);
  z-index: 100;
}
.skip-link:focus { transform: translateY(0); }


/* ------------------------------------------------------------- controls ---- */

.btn {
  --btn-bg: var(--color-surface);
  --btn-fg: var(--color-text);
  --btn-border: var(--color-border);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-2);
  padding: 0.72em 1.25em;
  min-height: 2.75rem;
  border: 1px solid var(--btn-border);
  border-radius: var(--radius-md);
  background: var(--btn-bg);
  color: var(--btn-fg);
  font-size: var(--text-sm);
  font-weight: var(--weight-medium);
  text-decoration: none;
  cursor: pointer;
  position: relative;
  transition:
    transform var(--duration-fast) var(--ease-standard),
    box-shadow var(--duration-fast) var(--ease-standard),
    background-color var(--duration-fast) var(--ease-standard),
    border-color var(--duration-fast) var(--ease-standard);
}

.btn:hover {
  transform: translateY(calc(var(--motion-lift) * -1));
  box-shadow: var(--shadow-md);
  border-color: var(--color-border-strong);
}

.btn:active { transform: translateY(0) scale(0.98); transition-duration: var(--duration-instant); }

.btn[disabled],
.btn[aria-disabled='true'] {
  opacity: 0.45;
  cursor: not-allowed;
  transform: none;
  box-shadow: none;
}

.btn[aria-busy='true'] { cursor: progress; }
.btn[aria-busy='true'] .btn__label { opacity: 0; }
.btn[aria-busy='true']::after {
  content: '';
  position: absolute;
  inset: 50% auto auto 50%;
  width: 1rem; height: 1rem;
  margin: -0.5rem 0 0 -0.5rem;
  border-radius: 50%;
  border: 2px solid currentColor;
  border-top-color: transparent;
  animation: artisan-spin 700ms linear infinite;
}

.btn--primary { --btn-bg: var(--color-accent); --btn-fg: var(--color-on-accent); --btn-border: transparent; }
.btn--primary:hover { --btn-bg: var(--color-accent-hover); box-shadow: var(--shadow-accentGlow); }

.btn--ghost { --btn-bg: transparent; }
.btn--ghost:hover { --btn-bg: var(--color-surface); }

.btn--quiet {
  --btn-bg: transparent;
  --btn-border: transparent;
  --btn-fg: var(--color-text-muted);
  padding-inline: var(--space-3);
}
.btn--quiet:hover { --btn-fg: var(--color-text); box-shadow: none; transform: none; }

.btn--block { width: 100%; }

.field { display: flex; flex-direction: column; gap: var(--space-2); }

.field__label { font-size: var(--text-sm); font-weight: var(--weight-medium); }

.field__control {
  width: 100%;
  padding: 0.75rem var(--space-4);
  min-height: 2.9rem;
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  transition:
    border-color var(--duration-fast) var(--ease-standard),
    box-shadow var(--duration-fast) var(--ease-standard),
    background-color var(--duration-fast) var(--ease-standard);
}

.field__control::placeholder { color: var(--color-text-faint); }
.field__control:hover { border-color: var(--color-border-strong); }
.field__control:focus {
  outline: none;
  border-color: var(--color-accent);
  box-shadow: 0 0 0 3px var(--color-accent-soft);
}
.field__control[aria-invalid='true'] {
  border-color: #d64545;
  box-shadow: 0 0 0 3px rgb(214 69 69 / 0.18);
}

.field__meta { display: flex; justify-content: space-between; gap: var(--space-3); }
.field__hint, .field__error { font-size: var(--text-xs); color: var(--color-text-muted); }
.field__error { color: #e05a5a; display: none; }
.field[data-invalid='true'] .field__error { display: block; }
.field[data-invalid='true'] .field__hint { display: none; }

.checkbox { display: flex; align-items: center; gap: var(--space-3); font-size: var(--text-sm); color: var(--color-text-muted); }
.checkbox input { width: 1.05rem; height: 1.05rem; accent-color: var(--color-accent); }

.tag {
  display: inline-flex;
  align-items: center;
  gap: var(--space-2);
  padding: 0.25rem 0.6rem;
  font-family: var(--font-mono);
  font-size: var(--text-xs);
  letter-spacing: var(--tracking-caps);
  text-transform: uppercase;
  color: var(--color-text-muted);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-pill);
}

@keyframes artisan-spin { to { transform: rotate(360deg); } }


/* ---------------------------------------------------------------- auth ---- */

.auth { min-height: 100svh; display: grid; place-items: center; padding: var(--space-8) var(--space-6); }

.auth__inner { width: 100%; max-width: 30rem; }

.auth__card {
  padding: var(--space-10);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-xl);
  background: var(--color-surface);
  box-shadow: var(--shadow-lg);
}

.auth__title { font-size: var(--text-3xl); letter-spacing: var(--tracking-display); }
.auth__sub { color: var(--color-text-muted); margin-top: var(--space-3); }
.auth__form { display: flex; flex-direction: column; gap: var(--space-5); margin-top: var(--space-8); }
.auth__divider {
  display: flex;
  align-items: center;
  gap: var(--space-4);
  color: var(--color-text-faint);
  font-size: var(--text-xs);
  text-transform: uppercase;
  letter-spacing: var(--tracking-caps);
}
.auth__divider::before, .auth__divider::after { content: ''; flex: 1; height: 1px; background: var(--color-border); }
.auth__foot { margin-top: var(--space-6); font-size: var(--text-sm); color: var(--color-text-muted); }
.auth__brand { font-family: var(--font-display); font-size: var(--text-lg); margin-bottom: var(--space-8); display: block; text-decoration: none; }

.auth__aside {
  display: none;
  padding: var(--space-12);
  border-left: 1px solid var(--color-border);
  background: color-mix(in oklab, var(--color-surface) 70%, var(--color-bg));
  flex-direction: column;
  justify-content: center;
  gap: var(--space-4);
}

@media (min-width: 64rem) {
  .auth--split { grid-template-columns: 1fr 1fr; place-items: stretch; }
  .auth--split .auth__aside { display: flex; }
  .auth--split .auth__inner { max-width: 26rem; }
}


/* ---------------------------------------------------------------- motion ---- */

[data-reveal] {
  opacity: 0;
  transform: translateY(var(--motion-distance));
  transition:
    opacity var(--duration-slow) var(--ease-entrance),
    transform var(--duration-slow) var(--ease-entrance);
  transition-delay: var(--reveal-delay, 0ms);
}
[data-reveal='in'] { opacity: 1; transform: none; }

[data-stagger] > * { transition-delay: calc(var(--stagger) * var(--i, 0)); }

.nav__toggle[aria-expanded='true'] + .nav__links { display: flex; }

/* Floating layers: one effect, two speeds. */
.float { animation: artisan-float 14s var(--ease-standard) infinite; }
.float--slow { animation-duration: 22s; animation-delay: -4s; }

@keyframes artisan-float {
  0%, 100% { transform: translate3d(0, 0, 0); }
  50% { transform: translate3d(0, -10px, 0); }
}

@keyframes artisan-in {
  from { opacity: 0; transform: translateY(var(--motion-distance)); }
  to { opacity: 1; transform: none; }
}

.enter { animation: artisan-in var(--duration-slow) var(--ease-emphasized) both; }

/* ----------------------------------------------------------- responsive ---- */

@media (max-width: 60rem) {
  .hero__title { font-size: var(--text-4xl); }
  .hero--editorial .hero__sub { margin-left: 0; }
  .hero--split .hero__inner { grid-template-columns: 1fr; gap: var(--space-8); }
  .showcase__inner { grid-template-columns: 1fr; gap: var(--space-8); }
  .features--list .feature { grid-template-columns: 2.5rem 1fr; }
  .features--list .feature__body { grid-column: 2 / -1; margin-top: var(--space-2); }
  .features--bento { grid-template-columns: repeat(2, 1fr); }
  .features--bento .feature,
  .features--bento .feature:nth-child(1),
  .features--bento .feature:nth-child(2) { grid-column: span 2; }
  .section { padding-block: var(--space-16, var(--space-12)); }
}

@media (max-width: 40rem) {
  .container { padding-inline: var(--space-4); }
  .nav__links {
    display: none;
    position: absolute;
    top: 100%;
    left: 0; right: 0;
    flex-direction: column;
    align-items: flex-start;
    gap: var(--space-4);
    padding: var(--space-6);
    background: var(--color-bg);
    border-bottom: 1px solid var(--color-border);
  }
  .nav__toggle {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 2.5rem; height: 2.5rem;
    background: none;
    border: 1px solid var(--color-border);
    border-radius: var(--radius-md);
    cursor: pointer;
  }
  .nav__toggle-bar,
  .nav__toggle-bar::before,
  .nav__toggle-bar::after {
    display: block;
    width: 16px; height: 1.5px;
    background: currentColor;
    position: relative;
  }
  .nav__toggle-bar::before, .nav__toggle-bar::after { content: ''; position: absolute; left: 0; }
  .nav__toggle-bar::before { top: -5px; }
  .nav__toggle-bar::after { top: 5px; }
  .hero__title { font-size: var(--text-3xl); line-height: 1.04; }
  .cta__panel { padding: var(--space-8) var(--space-6); }
  .auth__card { padding: var(--space-6); border-radius: var(--radius-lg); }
  .quote__text { font-size: var(--text-xl); }
  .metrics { grid-template-columns: repeat(2, 1fr); }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
  [data-reveal] { opacity: 1 !important; transform: none !important; }
  .float, .enter { animation: none !important; }
}

</style>

<body>
<a class="visually-hidden" href="#main">Skip to content</a>
<main id="main">
<main class="auth auth--split"><div class="auth__inner"><a class="auth__brand" href="#top">Artisan</a><div class="auth__card"><h1 class="auth__title">Sign in to Sign in</h1><p class="auth__sub">Use your email and password, or a passkey.</p><form class="auth__form" action="#" method="post" data-auth-form novalidate><div class="field" data-field="email"><label class="field__label" for="f-email">Email</label><input class="field__control" id="f-email" name="email" type="email" autocomplete="email" placeholder="you@company.com" required /><div class="field__meta"><span class="field__error" data-error>Please enter a valid email.</span></div></div>
<div class="field" data-field="password"><label class="field__label" for="f-password">Password</label><input class="field__control" id="f-password" name="password" type="password" autocomplete="current-password" placeholder="••••••••••" required /><div class="field__meta"><span class="field__error" data-error>Please enter a valid password.</span></div></div><label class="checkbox"><input type="checkbox" name="remember" /> Keep me signed in</label><button class="btn btn--primary btn--block" type="submit">Sign in</button><div class="auth__divider">or</div><button class="btn btn--block" type="button" data-passkey>Continue with passkey</button><p class="auth__foot">Forgot your password?</p></form></div></div><aside class="auth__aside" aria-label="Why"><h2>Everything in one place</h2><ul class="showcase__list"><li>Session control across devices</li>
<li>Passkeys and 2FA</li>
<li>Export your data anytime</li></ul></aside></main>
</main>
<script>
/* nav, FAQ, auth validation, reveal. */
(() => {
  const nav = document.querySelector("[data-nav]");
  const toggle = document.querySelector("[data-nav-toggle]");
  const links = document.querySelector(".nav__links");
  if (toggle && links) toggle.addEventListener("click", () => {
    const open = toggle.getAttribute("aria-expanded") === "true";
    toggle.setAttribute("aria-expanded", String(!open));
    links.style.display = open ? "" : "flex";
  });
  const onScroll = () => { if (nav) nav.setAttribute("data-scrolled", String(window.scrollY > 8)); };
  window.addEventListener("scroll", onScroll, { passive: true }); onScroll();
  document.querySelectorAll("[data-faq-q]").forEach((q) => q.addEventListener("click", () => {
    const open = q.getAttribute("aria-expanded") === "true";
    q.setAttribute("aria-expanded", String(!open));
    const panel = q.parentElement && q.parentElement.querySelector("[data-faq-a]");
    if (panel) panel.hidden = open;
  }));
  const form = document.querySelector("[data-auth-form]");
  if (form) form.addEventListener("submit", (e) => {
    let firstBad;
    form.querySelectorAll(".field").forEach((field) => {
      const input = field.querySelector("input");
      if (!input) return;
      const bad = !input.checkValidity();
      field.dataset.invalid = bad ? "true" : "false";
      input.setAttribute("aria-invalid", String(bad));
      if (bad && !firstBad) firstBad = input;
    });
    if (firstBad) { e.preventDefault(); firstBad.focus(); }
  });
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (!reduce && "IntersectionObserver" in window) {
    const io = new IntersectionObserver((entries) => entries.forEach((en) => {
      if (en.isIntersecting) { en.target.classList.add("enter"); io.unobserve(en.target); }
    }), { threshold: 0.12 });
    document.querySelectorAll("[data-reveal]").forEach((el) => io.observe(el));
  } else { document.querySelectorAll("[data-reveal]").forEach((el) => el.classList.add("enter")); }
})();

</script>
